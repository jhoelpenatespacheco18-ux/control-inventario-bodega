<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de bodega · Visain</title>
<style>
:root{--bg:#FAF7FD;--card:#fff;--ink:#2A1650;--mut:#6B6283;--pur:#4A2080;--gold:#E3A912;--line:#E2D8F0;--soft:#F2EDF9;--ok:#2E7D4F;--warn:#D17F00;--bad:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150E26;--card:#211738;--ink:#F1ECF9;--mut:#A99CC4;--pur:#B79DF0;--line:#3A2C5C;--soft:#2B1F4A;--ok:#6FCF97;--warn:#F2B13C;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150E26;--card:#211738;--ink:#F1ECF9;--mut:#A99CC4;--pur:#B79DF0;--line:#3A2C5C;--soft:#2B1F4A;--ok:#6FCF97;--warn:#F2B13C;--bad:#FF8A80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Georgia,"Times New Roman",serif;max-width:760px;margin:0 auto;padding-bottom:40px}
h1,h2,h3,button,input,select,textarea,.tabs{font-family:"Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(120deg,var(--h1),var(--h2));color:var(--hc);padding:16px 16px 12px;border-bottom:4px solid var(--gold);position:relative}
header h1{margin:0;font-size:20px;letter-spacing:.2px}header p{margin:2px 0 0;color:var(--hc);opacity:.85;font-size:13px;font-style:italic;padding-right:110px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line)}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:999px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--pur);color:#fff;border-color:var(--pur)}
:root[data-theme="dark"] .tabs button.on{color:#150E26}
:root{--h1:#4A2080;--h2:#2E1457;--hc:#fff}:root[data-theme="dark"]{--h1:#2E1457;--h2:#150E26}:root[data-theme="light"]{--bg:#fff;--soft:#F6F2FB}:root[data-theme="gold"]{--bg:#FFF8E6;--card:#FFFDF6;--ink:#3A2706;--mut:#7A6330;--pur:#8A5A00;--gold:#C98A00;--line:#EBD9A8;--soft:#FBEFC8;--h1:#F4CE5C;--h2:#D4A017;--hc:#2A1650;--ok:#2E7D4F;--warn:#B35C00;--bad:#B3261E;color-scheme:light}
#sheet{position:fixed;inset:0;background:#fff;color:#2A1650;overflow:auto;z-index:20;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;--ink:#2A1650;--mut:#6B6283;--line:#E2D8F0;--pur:#4A2080;--soft:#F2EDF9;--card:#fff;--bg:#fff;--gold:#E3A912}#sheet .tb{display:flex;gap:8px;margin-bottom:12px}@media print{body>*:not(#sheet){display:none!important}#sheet{position:static}.np{display:none!important}}
.th{position:absolute;right:12px;top:12px;display:flex;gap:4px}.th button{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);border-radius:8px;font-size:16px;padding:3px 7px;cursor:pointer}
main{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:12px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px;color:var(--pur)}h3{font-size:14px;margin:12px 0 6px}
label{display:block;font:600 12.5px "Segoe UI",system-ui,sans-serif;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--gold);color:#2A1650;border:0;padding:11px 16px;border-radius:8px;font-weight:700;font-size:15px;margin-top:12px;cursor:pointer;width:100%}
.btn.s{width:auto;padding:6px 10px;font-size:13px;margin:0;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 12px "Segoe UI",system-ui,sans-serif;color:var(--mut)}
.wrap{overflow-x:auto}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font:600 12px "Segoe UI",system-ui,sans-serif;background:var(--soft)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.mut{color:var(--mut);font-size:13px}.empty{color:var(--mut);padding:10px 0}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--pur);color:#fff;padding:12px 14px;border-radius:10px;display:none;font:14px "Segoe UI",system-ui,sans-serif;z-index:9;max-width:736px;margin:0 auto}
:root[data-theme="dark"] #toast{color:#150E26}
</style></head><body>
<header><div class="th"><button title="Blanco, de día" onclick="setTheme('light')">☀️</button><button title="Morado, de noche" onclick="setTheme('dark')">🌙</button><button title="Dorado, atardecer" onclick="setTheme('gold')">🌇</button></div><h1>Control de bodega · Visain International</h1><p>Entradas, vencimientos, despachos y préstamos en un solo lugar.</p></header>
<nav class="tabs" id="tabs"></nav><main id="main"></main><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var TABS=[["inv","Inventario"],["mat","Casa matriz"],["des","Despacho"],["per","Personas"],["pre","Préstamos"],["rep","Reportes"],["aju","Ajustes"],["pag","Pagos"],["env","Envíos"],["log","Bitácora"],["cal","Calculadora"],["cat","Catálogo"]],tab="inv",KEY="visain_bodega_v1";
var S=load();
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
return{prod:[{id:"p1",name:"Maxi 3",price:250000},{id:"p2",name:"Mak-Vid",price:0},{id:"p3",name:"Slym-Vid",price:0},{id:"p4",name:"Ether-Ju",price:0}],lots:[],orders:[],loans:[],mem:{"Semilla":20,"Emprendedor":25,"Impacto":30,"Infinity":40,"Fundador Oro":50},n:1}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)},v=function(i){return $(i).value.trim()};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return "x"+(S.n++)+Date.now().toString(36)}
function today(){return new Date().toISOString().slice(0,10)}
function days(d){return Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5)}
function money(n){return "$"+Math.round(n).toLocaleString("es-CO")}
function pname(id){var p=S.prod.filter(function(x){return x.id==id})[0];return p?p.name:"?"}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},4500)}
function used(lotId){var u=0;S.orders.forEach(function(o){o.del.forEach(function(d){d.al.forEach(function(a){if(a.lot==lotId)u+=a.q})})});S.loans.forEach(function(l){if(!l.ret)l.al.forEach(function(a){if(a.lot==lotId)u+=a.q})});return u}
function avail(l){return l.qty-used(l.id)}
function lotsOf(pid){return S.lots.filter(function(l){return l.pid==pid}).sort(function(a,b){return a.exp<b.exp?-1:1})}
function stock(pid){return lotsOf(pid).reduce(function(s,l){return s+avail(l)},0)}
function alloc(pid,q){var al=[],need=q;lotsOf(pid).forEach(function(l){var a=avail(l);if(need>0&&a>0&&days(l.exp)>=0){var t=Math.min(a,need);al.push({lot:l.id,q:t});need-=t}});return need>0?null:al}
function expTag(d){var n=days(d);if(n<0)return'<span class="chip bad">Vencido</span>';if(n<=30)return'<span class="chip bad">Vence en '+n+' d</span>';if(n<=90)return'<span class="chip warn">Vence en '+n+' d</span>';return'<span class="chip ok">'+n+' d</span>'}
function opts(sel){return S.prod.map(function(p){return'<option value="'+p.id+'"'+(p.id==sel?" selected":"")+'>'+esc(p.name)+"</option>"}).join("")}
function go(t){tab=t;render()}
function render(){
$("tabs").innerHTML=TABS.map(function(t){return'<button class="'+(t[0]==tab?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+"</button>"}).join("");
$("main").innerHTML=({inv:vInv,mat:vMat,des:vDes,per:vPer,pre:vPre,rep:vRep,aju:vAju,pag:vPag,env:vEnv,log:vLog,cal:vCal,cat:vCat})[tab]();
if(tab=="per")findP();if(tab=="cal"){cq();bx()}if(tab=="des")pkg();if(tab=="mat")upc()}
/* Inventario */
function vInv(){
var res=S.prod.map(function(p){var s=stock(p.id);return"<tr><td>"+esc(p.name)+'</td><td><b class="'+(lowQ(p.id,s)?"bad":"")+'">'+s+"</b> cajas"+(lowQ(p.id,s)?" · bajo el mínimo":"")+'</td><td><input type="number" style="width:72px" placeholder="mín." value="'+((S.min||{})[p.id]||"")+'" onchange="setMin(&quot;'+p.id+'&quot;,this.value)"></td></tr>'}).join("");
var lots=S.lots.slice().sort(function(a,b){return a.exp<b.exp?-1:1}).map(function(l){var a=avail(l);return"<tr><td>"+esc(pname(l.pid))+(l.lote?'<br><span class="mut">Lote '+esc(l.lote)+"</span>":"")+"</td><td>"+a+" de "+l.qty+"</td><td>"+esc(l.exp)+"<br>"+expTag(l.exp)+'</td><td><button class="btn s" onclick="editRec(&quot;lots&quot;,&quot;'+l.id+'&quot;)">Editar</button> '+(a==l.qty?'<button class="btn s" onclick="delLot(\''+l.id+'\')">Quitar</button>':"")+"</td></tr>"}).join("");
return'<div class="card"><h2>Existencias y mínimo</h2><table>'+res+'</table></div><div class="card"><h2>Registrar entrada de producto</h2><label>Número de lote</label><input id="ll"><label>Producto</label><select id="lp">'+opts()+'</select><div class="row"><div><label>Cantidad de cajas</label><input id="lq" type="number" min="1" inputmode="numeric"></div><div><label>Fecha de vencimiento</label><input id="le" type="date"></div></div><button class="btn" onclick="addLot()">Guardar entrada</button></div><div class="card"><h2>Lotes, el que vence primero arriba</h2>'+(lots?'<div class="wrap"><table><tr><th>Producto</th><th>Disponible</th><th>Vence</th><th></th></tr>'+lots+"</table></div>":'<div class="empty">Aún no hay lotes. Registra la primera entrada arriba.</div>')+"</div>"}
function addLot(){var q=+v("lq"),e=v("le");if(!(q>0)||!e)return toast("Escribe la cantidad y la fecha de vencimiento.");S.lots.push({id:uid(),pid:v("lp"),lote:v("ll"),qty:q,exp:e,date:today()});save();toast("Entrada guardada.");render()}
function delLot(id){S.lots=S.lots.filter(function(l){return l.id!=id});save();render()}
/* Despacho */
function vDes(){
var mem=Object.keys(S.mem).map(function(m){return"<option>"+m+"</option>"}).join("");
var rec=[];S.orders.forEach(function(o){o.del.forEach(function(d){rec.push([d.date,o,d])})});rec.sort(function(a,b){return a[0]<b[0]?1:-1});
var rows=rec.slice(0,8).map(function(r){return"<tr><td>"+esc(r[0])+"</td><td>"+esc(r[1].name)+"</td><td>"+esc(pname(r[1].pid))+" × "+r[2].q+"</td></tr>"}).join("");
return'<div class="card"><h2>Registrar una salida</h2><label>Nombre del afiliado</label><input id="dn" autocomplete="off"><div class="row"><div><label>Cédula o documento</label><input id="dd"></div><div><label>Ciudad</label><input id="dc"></div></div><div class="row"><div><label>Membresía</label><select id="dm">'+mem+'</select></div><div><label>Producto</label><select id="dp">'+opts()+'</select></div></div><div class="row"><div><label>Cajas que se lleva ahora</label><input id="dq" type="number" min="1" inputmode="numeric"></div><div><label>Total del pedido</label><input id="dt" type="number" min="1" inputmode="numeric" placeholder="Si es igual, déjalo vacío"></div></div><label>Notas</label><textarea id="dx" rows="2"></textarea><button class="btn" onclick="doDes()">Registrar salida</button><p class="mut">Si la persona ya tiene un pedido pendiente de ese producto, la salida se suma a ese pedido.</p></div><div class="card"><h2>Últimas salidas</h2>'+(rows?"<table>"+rows+"</table>":'<div class="empty">Todavía no hay salidas.</div>')+"</div>"}
function doDes(){
var n=v("dn"),doc=v("dd"),pid=v("dp"),q=+v("dq"),t=+v("dt")||q;
if(!n||!(q>0))return toast("Escribe el nombre y las cajas que se lleva.");
if(t<q)return toast("El total del pedido no puede ser menor a lo que se lleva ahora.");
var al=alloc(pid,q);if(!al)return toast("No alcanza el stock vigente: hay "+stock(pid)+" cajas disponibles de "+pname(pid)+".");
var o=S.orders.filter(function(x){return x.pid==pid&&(doc?x.doc==doc:x.name.toLowerCase()==n.toLowerCase())&&x.tot-x.del.reduce(function(s,d){return s+d.q},0)>0})[0];
var pr=S.prod.filter(function(p){return p.id==pid})[0],mp=S.mem[v("dm")]||0;
var unit=pr.price-(pr.price/2)*mp/100;
if(!o){o={id:uid(),name:n,doc:doc,city:v("dc"),mem:v("dm"),pid:pid,tot:t,note:v("dx"),date:today(),del:[]};S.orders.push(o)}
else{if(v("dt"))o.tot=Math.max(o.tot,+v("dt"));if(v("dx"))o.note=(o.note?o.note+" | ":"")+v("dx")}
o.del.push({date:today(),q:q,al:al,unit:unit});save();
var pend=o.tot-o.del.reduce(function(s,d){return s+d.q},0);
toast(n+": "+q+" × "+pr.name+" a "+money(unit)+" c/u = "+money(unit*q)+". Pendiente: "+pend+".");go("des")}
/* Personas */
function vPer(){return'<div class="card"><h2>Buscar persona</h2><input id="ps" placeholder="Nombre o cédula" oninput="findP()"><div id="pr"></div></div>'}
function findP(){
var el=$("pr");if(!el)return;var q=(($("ps")||{}).value||"").toLowerCase().trim(),h="";
var os=S.orders.filter(function(o){return q?(o.name.toLowerCase().indexOf(q)>-1||String(o.doc).toLowerCase().indexOf(q)>-1):o.tot-o.del.reduce(function(s,d){return s+d.q},0)>0});
var ls=q?S.loans.filter(function(l){return l.name.toLowerCase().indexOf(q)>-1||String(l.doc).indexOf(q)>-1}):[];
h+='<h3>'+(q?"Pedidos":"Pendientes por entregar")+"</h3>";
if(!os.length)h+='<div class="empty">'+(q?"No hay pedidos con ese dato.":"No hay entregas pendientes.")+"</div>";
os.forEach(function(o){var d=o.del.reduce(function(s,x){return s+x.q},0),p=o.tot-d,tot=o.del.reduce(function(s,x){return s+x.q*x.unit},0);
h+='<div class="card"><b>'+esc(o.name)+"</b> "+(o.doc?'<span class="mut">C.C. '+esc(o.doc)+"</span>":"")+'<br><span class="mut">'+esc(o.mem)+" · "+esc(o.city||"Sin ciudad")+" · desde "+esc(o.date)+"</span><p>"+esc(pname(o.pid))+": llevó <b>"+d+"</b> de "+o.tot+", "+(p>0?'<b class="warn">faltan '+p+"</b>":'<b class="ok">completo</b>')+"<br>Valor entregado: "+money(tot)+"</p>"+(o.note?'<p class="mut">Notas: '+esc(o.note)+"</p>":"")+"<table>"+o.del.map(function(x){return"<tr><td>"+esc(x.date)+"</td><td>"+x.q+" cajas</td><td>"+money(x.unit)+" c/u</td></tr>"}).join("")+"</table>"+'<button class="btn s" style="margin:8px 6px 0 0" onclick="sheet(\''+o.id+'\')">Ver orden de despacho</button>'+(p>0?'<button class="btn s" style="margin-top:8px" onclick="deliver(\''+o.id+'\')">Entregar pendiente</button>':"")+"</div>"});
if(ls.length){h+="<h3>Préstamos</h3>";ls.forEach(function(l){h+='<div class="card">'+esc(pname(l.pid))+" × "+l.q+" · devolver "+esc(l.due)+" · "+(l.ret?'<span class="ok">devuelto</span>':'<span class="warn">pendiente</span>')+"</div>"})}
el.innerHTML=h}
function deliver(id){var o=S.orders.filter(function(x){return x.id==id})[0];go("des");$("dn").value=o.name;$("dd").value=o.doc;$("dc").value=o.city;$("dm").value=o.mem;$("dp").value=o.pid;$("dq").value=o.tot-o.del.reduce(function(s,d){return s+d.q},0);window.scrollTo(0,0)}
/* Préstamos */
function vPre(){
var rows=S.loans.slice().sort(function(a,b){return a.due<b.due?-1:1}).map(function(l){var n=days(l.due),tag=l.ret?'<span class="ok">Devuelto</span>':(n<0?'<span class="bad">Vencido hace '+(-n)+" d</span>":"En "+n+" d");return"<tr><td>"+esc(l.name)+"<br><span class=\"mut\">"+esc(l.city||"")+"</span></td><td>"+esc(pname(l.pid))+" × "+l.q+"</td><td>"+esc(l.due)+"<br>"+tag+"</td><td>"+(l.ret?"":'<button class="btn s" onclick="ret(\''+l.id+'\')">Devolver</button>')+"</td></tr>"}).join("");
return'<div class="card"><h2>Registrar un préstamo</h2><label>Nombre de quien lo recibe</label><input id="ln"><div class="row"><div><label>Cédula</label><input id="ld"></div><div><label>Ciudad de destino</label><input id="lc"></div></div><div class="row"><div><label>Producto</label><select id="lpp">'+opts()+'</select></div><div><label>Cajas</label><input id="lqq" type="number" min="1" inputmode="numeric"></div></div><label>Fecha de devolución</label><input id="lf" type="date"><button class="btn" onclick="addLoan()">Guardar préstamo</button></div><div class="card"><h2>Préstamos registrados</h2>'+(rows?'<div class="wrap"><table>'+rows+"</table></div>":'<div class="empty">No hay préstamos registrados.</div>')+"</div>"}
function addLoan(){var q=+v("lqq"),pid=v("lpp");if(!v("ln")||!(q>0)||!v("lf"))return toast("Completa nombre, cajas y fecha de devolución.");var al=alloc(pid,q);if(!al)return toast("No alcanza el stock vigente: hay "+stock(pid)+" cajas.");S.loans.push({id:uid(),name:v("ln"),doc:v("ld"),city:v("lc"),pid:pid,q:q,due:v("lf"),al:al,ret:false});save();toast("Préstamo guardado.");render()}
function ret(id){S.loans.forEach(function(l){if(l.id==id)l.ret=true});save();render()}
/* Catálogo */
function vCat(){
var rows=S.prod.map(function(p){return'<tr><td><input value="'+esc(p.name)+'" onchange="upP(\''+p.id+'\',\'name\',this.value)"></td><td><input type="number" value="'+p.price+'" onchange="upP(\''+p.id+'\',\'price\',+this.value)"></td><td>'+(p.price/2000)+" pts</td></tr>"}).join("");
var ms=Object.keys(S.mem).map(function(m){return"<tr><td>"+esc(m)+'</td><td><input type="number" value="'+S.mem[m]+'" onchange="S.mem[\''+m+'\']=+this.value;save()"></td></tr>'}).join("");
return'<div class="card"><h2>Productos y precios</h2><div class="wrap"><table><tr><th>Nombre</th><th>Precio (COP)</th><th>Puntos</th></tr>'+rows+'</table></div><button class="btn s" style="margin-top:10px" onclick="addP()">Agregar producto</button><p class="mut">Los puntos son la mitad del precio dividida entre mil. Un punto vale $1.000.</p></div><div class="card"><h2>Descuento en puntos por membresía (%)</h2><table>'+ms+'</table></div><div class="card"><h2>Copia de seguridad</h2><textarea id="bk" rows="3" placeholder="Aquí aparece la copia o pega una para restaurar"></textarea><div class="row"><button class="btn" onclick="S.bk=today();save();$(\'bk\').value=JSON.stringify(S);$(\'bk\').select();try{document.execCommand(\'copy\')}catch(e){}toast(\'Copia lista: guárdala en un lugar seguro.\')">Crear copia</button><button class="btn" onclick="restore()">Restaurar</button></div><p class="mut">Los datos se guardan en este navegador. Haz una copia con frecuencia.</p></div>'}
function upP(id,k,val){S.prod.forEach(function(p){if(p.id==id)p[k]=val});save();if(k=="price")render()}
function addP(){S.prod.push({id:uid(),name:"Nuevo producto",price:0});save();render()}
function restore(){try{var d=JSON.parse(v("bk"));if(!d.prod||!d.lots)throw 0;S=d;save();toast("Datos restaurados.");render()}catch(e){toast("La copia pegada no es válida.")}}
/* v2 */
var DOCT=["Cédula de ciudadanía","DNI","PPT","Cédula de extranjería","Otro"];
var PK={"Semilla":{A:{"Maxi 3":1,"Mak-Vid":1,"Ether-Ju":1},B:{"Maxi 3":2}},"Emprendedor":{A:{"Maxi 3":3,"Mak-Vid":2,"Slym-Vid":1,"Ether-Ju":1},B:{"Maxi 3":5}},"Impacto":{A:{"Maxi 3":7,"Mak-Vid":4,"Slym-Vid":2,"Ether-Ju":2},B:{"Maxi 3":11}},"Infinity":{A:{"Maxi 3":15,"Mak-Vid":10,"Slym-Vid":5,"Ether-Ju":5},B:{"Maxi 3":26}},"Fundador Oro":{A:{"Maxi 3":10,"Mak-Vid":35,"Slym-Vid":15,"Ether-Ju":15},B:{"Maxi 3":45}}};
var LV={"Bono Impulso":[35,6,3,1,1,1,3],"Bono Residual Ascendente":[35,6,3,1,1,1,3],"Bono Ayudando y Ganando":[40,10,2,2,2,2,2],"Bono Aliado Comercial":[20,5,5,5,5,5,5]};
S.people=S.people||{};
function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("visain_theme",t)}catch(e){}}

function vDes(){

var rows=rec.slice(0,8).map(function(r){return"<tr><td>"+esc(r[0])+"</td><td>"+esc(r[1].name)+"</td><td>"+esc(pname(r[1].pid))+" × "+r[2].q+"</td></tr>"}).join("");

function pkg(){var m=$("dm").value,o=$("dop").value,p=pname($("dp").value),k=PK[m]&&PK[m][o],h="";if(k){h=Object.keys(k).map(function(n){return n+" × "+k[n]}).join(" · ");if(k[p])$("dt").value=k[p]}$("dh").textContent=k?"Paquete "+m+", opción "+o+": "+h:""}

function doDes(){
var n=v("dn"),doc=v("dd"),pid=v("dp"),q=+v("dq"),t=+v("dt")||q;
if(!n||!(q>0))return toast("Escribe el nombre y las cajas que se lleva.");
if(t<q)return toast("El total del pedido no puede ser menor a lo que se lleva ahora.");
var al=alloc(pid,q);if(!al)return toast("No alcanza el stock vigente: hay "+stock(pid)+" cajas disponibles de "+pname(pid)+".");
var P={n:n,td:v("dtd"),doc:doc,cel:v("dcel"),em:v("dem"),sp:v("dsp"),city:v("dc"),dep:v("ddp"),dom:v("ddom")},f=v("df")||today();
if(doc)S.people[doc]=P;
var o=S.orders.filter(function(x){return x.pid==pid&&(doc?x.doc==doc:x.name.toLowerCase()==n.toLowerCase())&&x.tot-x.del.reduce(function(s,d){return s+d.q},0)>0})[0];
var pr=S.prod.filter(function(p){return p.id==pid})[0],mp=S.mem[v("dm")]||0,unit=pr.price-(pr.price/2)*mp/100;
if(!o){o={id:uid(),name:n,td:P.td,doc:doc,cel:P.cel,em:P.em,sp:P.sp,city:P.city,dep:P.dep,dom:P.dom,mem:v("dm"),op:v("dop"),pid:pid,tot:t,note:v("dx"),date:f,del:[]};S.orders.push(o)}
else{if(v("dt"))o.tot=Math.max(o.tot,t);if(v("dx"))o.note=(o.note?o.note+" | ":"")+v("dx")}
o.del.push({date:f,q:q,al:al,unit:unit});save();
var pend=o.tot-o.del.reduce(function(s,d){return s+d.q},0);
toast(n+": "+q+" × "+pr.name+" a "+money(unit)+" c/u = "+money(unit*q)+". Pendiente: "+pend+".");go("des")}
function deliver(id){var o=S.orders.filter(function(x){return x.id==id})[0];go("des");var m={dn:o.name,dtd:o.td,dd:o.doc,dcel:o.cel,dem:o.em,dsp:o.sp,dc:o.city,ddp:o.dep,ddom:o.dom,dm:o.mem,dop:o.op,dp:o.pid};for(var k in m)if(m[k]!=null)$(k).value=m[k];pkg();$("dq").value=o.tot-o.del.reduce(function(s,d){return s+d.q},0);$("dt").value=o.tot;window.scrollTo(0,0)}
function findP(){var el=$("pr");if(!el)return;var q=((($("ps")||{}).value)||"").toLowerCase().trim(),h="";
function pend(o){return o.tot-o.del.reduce(function(s,d){return s+d.q},0)}
var os=S.orders.filter(function(o){return q?[o.name,o.doc,o.cel].join(" ").toLowerCase().indexOf(q)>-1:pend(o)>0});
var ls=q?S.loans.filter(function(l){return (l.name+" "+l.doc).toLowerCase().indexOf(q)>-1}):[];
h+="<h3>"+(q?"Pedidos":"Pendientes por entregar")+"</h3>";
if(!os.length)h+='<div class="empty">'+(q?"No hay pedidos con ese dato.":"No hay entregas pendientes.")+"</div>";
os.forEach(function(o){var d=o.del.reduce(function(s,x){return s+x.q},0),p=o.tot-d,tot=o.del.reduce(function(s,x){return s+x.q*x.unit},0);

if(ls.length){h+="<h3>Préstamos</h3>";ls.forEach(function(l){h+='<div class="card">'+esc(pname(l.pid))+" × "+l.q+" · devolver "+esc(l.due)+" · "+(l.ret?'<span class="ok">devuelto</span>':'<span class="warn">pendiente</span>')+"</div>"})}

function cfgCard(){return'<div class="card"><h2>Reglas de despacho</h2><label>Días mínimos de vigencia para despachar</label><input type="number" min="0" value="'+(S.minDays||0)+'" onchange="S.minDays=+this.value||0;save()"><p class="mut">Con 60, el sistema no entrega lotes que venzan en menos de 60 días. Con 0 solo evita los ya vencidos.</p></div><div class="card"><h2>Exportar a Excel</h2><p class="mut">Un archivo con bodega, casa matriz, despachos, pagos, envíos y bitácora.</p><button class="btn" onclick="exportX()">Descargar Excel</button></div>'}
var _vCat2=vCat;vCat=function(){return _vCat2()+cfgCard()};
function exportX(){if(!window.XLSX)return toast("No se pudo cargar el generador de Excel. Revisa tu conexión.");
var W=XLSX.utils.book_new();function sh(n,rows){XLSX.utils.book_append_sheet(W,XLSX.utils.json_to_sheet(rows.length?rows:[{"Sin datos":""}]),n)}
sh("Bodega",S.lots.map(function(l){return{Producto:pname(l.pid),Lote:l.lote||"",Vence:l.exp,"Cajas recibidas":l.qty,Disponible:avail(l),Entrada:l.date}}));
sh("Casa matriz",S.matriz.map(function(e){return{Producto:pname(e.pid),Tipo:e.k=="S"?"Frascos sueltos":"Cajas",Lote:e.lote||"",Vence:e.exp,Cajas:eC(e).c,Frascos:eC(e).u,Contado:e.date,Notas:e.note||""}}));
var dr=[];S.orders.forEach(function(o){o.del.forEach(function(d){dr.push({Fecha:d.date,Persona:o.name,Documento:(o.td||"")+" "+(o.doc||""),Celular:o.cel||"",Ciudad:o.city||"",Departamento:o.dep||"",Membresía:o.mem,Opción:o.op||"",Producto:pname(o.pid),Cajas:d.q,"Precio c/u":Math.round(d.unit),Valor:Math.round(d.unit*d.q),"Total del pedido":o.tot})})});sh("Despachos",dr);
sh("Pagos",S.pays.map(function(p){var q=persons().filter(function(x){return x.k==p.k})[0];return{Fecha:p.date,Persona:q?q.n:p.k,Valor:p.amt,Medio:p.met,Nota:p.note||""}}));
sh("Envíos",S.ship.map(function(s){return{Fecha:s.date,Tipo:s.tipo,Autorizado:s.who,Destinatario:s.dest,Ciudad:s.city,Producto:pname(s.pid),Cajas:s.q,Transportadora:s.tr||"",Guía:s.guia||""}}));
sh("Bitácora",S.log.map(function(e){return{Fecha:e.t,Quién:e.w,Acción:e.a,Detalle:e.d}}));
var buf=XLSX.write(W,{bookType:"xlsx",type:"array"});
if(!window.claude)return toast("Esta vista no permite descargar archivos.");
claude.use("downloads").then(function(dl){if(!dl)return toast("Esta vista no permite descargar archivos.");return dl.save({filename:"Visain_control_"+today()+".xlsx",data:buf}).then(function(){toast("Archivo guardado.")})}).catch(function(e){if(!e||e.code!="declined")toast("No se pudo guardar el archivo.")})}
function ban(){var m=$("main"),h="",g=S.lots.length||S.orders.length||S.matriz.length;
if(g){var n=S.bk?-days(S.bk):null,c=S.lastCount?-days(S.lastCount):null;
if(n===null||n>7)h+='<div class="ban">'+(n===null?"Aún no has hecho una copia de seguridad.":"Hace "+n+" días que no haces una copia de seguridad.")+' <a href="#" onclick="go(\'cat\');return false" style="color:var(--pur);font-weight:700">Ir al Catálogo</a></div>';
if(c===null||c>30)h+='<div class="ban">'+(c===null?"Aún no has registrado un conteo físico.":"Hace "+c+" días que no haces el conteo físico.")+' <a href="#" onclick="go(\'aju\');return false" style="color:var(--pur);font-weight:700">Ir a Ajustes</a></div>'}
m.insertAdjacentHTML("afterbegin",h);m.insertAdjacentHTML("beforeend",'<p class="mut" style="text-align:center">Versión 2.2 · 18 de octubre de 2026</p>')}
render();
</script></body></html>
